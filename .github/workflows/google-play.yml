name: Build Android

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Marketing version, e.g. 1.0.6 (without v)'
        required: true
        type: string
      distribution:
        description: 'Build artifacts only, or explicitly upload to Play internal testing'
        required: true
        type: choice
        default: build-only
        options:
          - build-only
          - internal

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package no longer exists; required SDK platforms/build-tools are on ubuntu-latest.
          packages: 'platform-tools'
          accept-android-sdk-licenses: false

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_COGNITO_REGION: us-east-1
          VITE_COGNITO_USER_POOL_ID: us-east-1_RhGVzVRp9
          VITE_COGNITO_CLIENT_ID: 52tpeumvp9sdjrm025n0aj36da
          VITE_COGNITO_DOMAIN: https://runcount-prod-107027.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: https://runcount.rbios.net/auth/callback
          VITE_COGNITO_LOGOUT_URI: https://runcount.rbios.net/
          VITE_API_URL: https://4efpwsj952.execute-api.us-east-1.amazonaws.com
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: VITE_BASE=./ npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Resolve version metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="$REQUESTED_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid marketing version: use a version such as 1.0.6" >&2
            exit 1
          fi
          echo "ANDROID_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Verify signed artifacts
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$(dirname "$APKSIGNER")/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-metadata.txt"
          grep -Fq "name='net.rbios.runcount' versionCode='$ANDROID_VERSION_CODE' versionName='$ANDROID_VERSION_NAME'" "$RUNNER_TEMP/apk-metadata.txt"
          LC_ALL=C jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/aab-verification.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/aab-verification.txt"
          sha256sum "$APK" "$AAB" | tee android-artifact-sha256.txt

      - name: Upload to Play Store internal track
        # Keep release publication unchanged; manual builds publish only when explicitly selected.
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.distribution == 'internal')
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          npm install --no-save googleapis@latest
          cat > upload-aab.mjs << 'NODESCRIPT'
          import { google } from 'googleapis'
          import { readFileSync } from 'node:fs'

          const PACKAGE = 'net.rbios.runcount'
          const TRACK = 'internal'
          const AAB_PATH = 'android/app/build/outputs/bundle/release/app-release.aab'
          const VERSION_NAME = process.env.ANDROID_VERSION_NAME

          const rawJson = process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || ''
          if (!rawJson) {
            console.error('GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is empty')
            process.exit(1)
          }
          const credentials = JSON.parse(rawJson)
          const auth = new google.auth.GoogleAuth({
            credentials,
            scopes: ['https://www.googleapis.com/auth/androidpublisher'],
          })
          const publisher = google.androidpublisher({ version: 'v3', auth })

          // Try 'completed' (auto-rollout to internal testers). The Play API
          // rejects this for apps still in Play Console draft state — fall back
          // to 'draft' (requires manual promotion in Play Console UI) so the
          // workflow keeps working until the app is past draft.
          const setReleaseStatus = (edit, versionCode, status) =>
            publisher.edits.tracks.update({
              packageName: PACKAGE,
              editId: edit.data.id,
              track: TRACK,
              requestBody: {
                track: TRACK,
                releases: [{ name: VERSION_NAME, status, versionCodes: [String(versionCode)] }],
              },
            })

          const tryRelease = async (status) => {
            const edit = await publisher.edits.insert({ packageName: PACKAGE })
            const upload = await publisher.edits.bundles.upload({
              packageName: PACKAGE,
              editId: edit.data.id,
              media: { mimeType: 'application/octet-stream', body: readFileSync(AAB_PATH) },
            })
            const versionCode = upload.data.versionCode
            await setReleaseStatus(edit, versionCode, status)
            await publisher.edits.commit({ packageName: PACKAGE, editId: edit.data.id })
            return versionCode
          }

          try {
            const versionCode = await tryRelease('completed')
            console.log(`Uploaded versionCode ${versionCode} to ${TRACK} track (auto-rolled out to testers)`)
          } catch (e) {
            const msg = e.response?.data?.error?.message || e.message || ''
            const isDraftAppError = /draft/i.test(msg) && /status/i.test(msg)
            if (!isDraftAppError) {
              console.error('Upload failed', e.code || e.response?.status, msg)
              if (e.response?.data) console.error(JSON.stringify(e.response.data, null, 2))
              process.exit(1)
            }
            console.log(`'completed' rejected (app still in Play Console draft state) — retrying as draft`)
            try {
              const versionCode = await tryRelease('draft')
              console.log(`Uploaded versionCode ${versionCode} to ${TRACK} track as draft — promote manually in Play Console`)
            } catch (e2) {
              console.error('Draft fallback also failed', e2.code || e2.response?.status, e2.message)
              if (e2.response?.data) console.error(JSON.stringify(e2.response.data, null, 2))
              process.exit(1)
            }
          }
          NODESCRIPT
          node upload-aab.mjs

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload artifact checksums
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact-sha256
          path: android-artifact-sha256.txt
          if-no-files-found: error

      - name: Summarize Android build
        if: success()
        env:
          DISTRIBUTION: ${{ github.event_name == 'release' && 'internal' || inputs.distribution || 'build-only' }}
        run: |
          {
            echo "## Android $ANDROID_VERSION_NAME ($ANDROID_VERSION_CODE)"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Distribution: $DISTRIBUTION"
            echo "- APK: app-release-apk (direct installation; signed with the upload keystore)"
            echo "- AAB: app-release-aab (Play upload; not directly installable)"
            echo "- The APK may not update a Play-installed copy if Play App Signing uses a different certificate. Do not uninstall an existing app without preserving its local matches."
          } >> "$GITHUB_STEP_SUMMARY"
