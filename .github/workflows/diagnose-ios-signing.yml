name: Diagnose iOS signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unlock existing distribution keychain
        id: signing
        run: bash scripts/prepare-ios-signing.sh
      - name: Inspect runner and test unattended signing
        run: python3 scripts/diagnose-ios-signing.py
      - name: Lock distribution keychain
        if: always() && steps.signing.outcome == 'success'
        run: bash scripts/prepare-ios-signing.sh lock
