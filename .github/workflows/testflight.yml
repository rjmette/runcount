name: Deploy to TestFlight

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Optional iOS marketing version (for example, 1.0.5)'
        required: false
        type: string
      build_number:
        description: 'Optional iOS build number; defaults to the workflow run number'
        required: false
        type: string

env:
  NODE_VERSION: '22'
  APPLE_TEAM_ID: U4L88W98BS

jobs:
  build-and-upload:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_COGNITO_REGION: us-east-1
          VITE_COGNITO_USER_POOL_ID: us-east-1_RhGVzVRp9
          VITE_COGNITO_CLIENT_ID: 52tpeumvp9sdjrm025n0aj36da
          VITE_COGNITO_DOMAIN: https://runcount-prod-107027.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: https://runcount.rbios.net/auth/callback
          VITE_COGNITO_LOGOUT_URI: https://runcount.rbios.net/
          VITE_API_URL: https://4efpwsj952.execute-api.us-east-1.amazonaws.com
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: VITE_BASE=./ npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Verify iOS web bundle parity
        run: node scripts/verify-mobile-bundle.mjs

      - name: Resolve version metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_MARKETING_VERSION: ${{ inputs.marketing_version }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          BUILD_NUMBER="$REQUESTED_BUILD_NUMBER"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${{ github.run_number }}"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          if [ -n "$REQUESTED_MARKETING_VERSION" ]; then
            VERSION="$REQUESTED_MARKETING_VERSION"
          elif [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v1.0.0)"
          fi
          VERSION="${VERSION#v}"
          # Strip prerelease suffix (e.g. 0.1.0-rc1 -> 0.1.0). Apple's
          # CFBundleShortVersionString must be 1-3 period-separated integers.
          VERSION="${VERSION%%-*}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Unsupported iOS marketing version: $VERSION" >&2
            exit 1
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unsupported iOS build number: $BUILD_NUMBER" >&2
            exit 1
          fi
          echo "MARKETING_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY" || {
            echo "APP_STORE_CONNECT_API_KEY is not configured" >&2
            exit 1
          }
          test -n "$APP_STORE_CONNECT_API_KEY_ID" || {
            echo "APP_STORE_CONNECT_API_KEY_ID is not configured" >&2
            exit 1
          }
          ASC_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          umask 077
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$ASC_API_KEY_PATH"
          echo "ASC_API_KEY_PATH=$ASC_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath ios/App/SPM

      - name: Build and archive
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ios/App/SPM \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ env.APPLE_TEAM_ID }} \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ env.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          PLIST

          set -o pipefail
          if ! xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/testflight-export.log"; then
            if grep -q 'FORBIDDEN.REQUIRED_AGREEMENTS_MISSING_OR_EXPIRED' "$RUNNER_TEMP/testflight-export.log"; then
              echo '::error title=Apple agreement required::App Store Connect requires an in-effect agreement. Accept the required agreement in App Store Connect, then rerun this workflow.'
            fi
            exit 1
          fi

      - name: Upload TestFlight export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-export-log-${{ github.run_number }}
          path: ${{ runner.temp }}/testflight-export.log
          if-no-files-found: ignore

      - name: Remove App Store Connect API key
        if: always()
        run: |
          if [ -n "${ASC_API_KEY_PATH:-}" ]; then
            rm -f "$ASC_API_KEY_PATH"
          fi
